<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Hand Rig</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <!-- Add the GLTFLoader script here -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: 'Inter', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-panel { position: absolute; top: 20px; right: 20px; z-index: 10; width: 320px; max-height: 90vh; overflow-y: auto; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body class="text-white">

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-panel" class="bg-black/80 backdrop-blur-md p-6 rounded-xl border border-white/10 shadow-2xl">
        <h1 class="text-xl font-bold mb-2">Interactive Hand Rig</h1>
        <p id="status-msg" class="text-xs text-yellow-400 font-bold mb-6 border-b border-white/10 pb-4">
            Attempting to load interactive_hand.glb... Please wait. (Check console if it hangs)
        </p>

        <div class="mb-6 bg-blue-500/20 text-blue-200 text-xs p-3 rounded border border-blue-500/30">
            <strong>Controls:</strong> Click & drag background to orbit. Click a joint (sphere) to rotate it.
        </div>

        <!-- Skin Tone Slider -->
        <div class="mb-5">
            <label class="block text-sm font-medium mb-1 flex justify-between">
                <span>Skin Tone</span>
                <span id="tone-val" class="text-gray-400">50%</span>
            </label>
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 rounded-full bg-[#ffe0bd] border border-gray-500"></div>
                <input type="range" id="skin-tone" min="0" max="100" value="50" class="w-full accent-blue-500">
                <div class="w-4 h-4 rounded-full bg-[#2d160e] border border-gray-500"></div>
            </div>
        </div>

        <!-- Character Slider -->
        <div class="mb-5">
            <label class="block text-sm font-medium mb-1 flex justify-between">
                <span>Character (Knuckle Size)</span>
                <span id="char-val" class="text-gray-400">Medium</span>
            </label>
            <div class="flex items-center justify-between text-xs text-gray-400 mb-1">
                <span>Delicate</span>
                <span>Rough</span>
            </div>
            <input type="range" id="character" min="0" max="100" value="50" class="w-full accent-blue-500">
        </div>

        <!-- Gender Traits -->
        <div class="mb-5">
            <label class="block text-sm font-medium mb-2">Traits (Palm Width)</label>
            <div class="flex bg-white/10 rounded-lg p-1">
                <button id="btn-fem" class="flex-1 py-1.5 text-sm rounded-md bg-blue-500 text-white shadow transition-colors">Feminine</button>
                <button id="btn-masc" class="flex-1 py-1.5 text-sm rounded-md hover:bg-white/20 transition-colors">Masculine</button>
            </div>
        </div>
        
        <button id="reset-btn" class="w-full mt-4 bg-white/10 hover:bg-white/20 py-2 rounded text-sm transition-colors border border-white/20">
            Reset Pose & Settings
        </button>
    </div>

    <script>
        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // Soft gradient-like background
        scene.background = new THREE.Color('#1a1a1a');
        scene.fog = new THREE.FogExp2('#1a1a1a', 0.03);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 8, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- CONTROLS ---
        const orbit = new THREE.OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;
        orbit.dampingFactor = 0.05;
        orbit.target.set(0, 2, 0);

        const transformControl = new THREE.TransformControls(camera, renderer.domElement);
        transformControl.addEventListener('dragging-changed', function (event) {
            orbit.enabled = !event.value;
        });
        transformControl.setMode('rotate');
        transformControl.setSpace('local'); 
        scene.add(transformControl);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffeedd, 1);
        dirLight.position.set(-5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x90b0d0, 0.5);
        fillLight.position.set(5, 5, -5);
        scene.add(fillLight);

        // Add a floor grid
        const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(grid);

        // --- GLTF LOADER LOGIC ---
        let handMesh = null;
        const skeletonBones = [];
        const selectableJoints = [];
        
        const loader = new THREE.GLTFLoader();
        
        // We create small, semi-transparent spheres on the bones so the Raycaster has something physical to click
        const hitboxMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x00ff00, 
            transparent: true, 
            opacity: 0.3, 
            depthTest: false 
        });
        const hitboxGeo = new THREE.SphereGeometry(0.3, 16, 16); 

        loader.load('interactive_hand.glb', function (gltf) {
            const model = gltf.scene;
            
            // --- AUTO-SCALE & CENTER FIX ---
            // This prevents the model from being microscopic or massive based on artist export settings
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3()).length();
            const center = box.getCenter(new THREE.Vector3());

            model.position.x += (model.position.x - center.x);
            model.position.y += (model.position.y - center.y) + 2; // Hover slightly above the grid
            model.position.z += (model.position.z - center.z);
            
            // Normalize scale so it fits perfectly in the 10-unit camera view
            if (size > 0) {
                const scale = 10 / size;
                model.scale.setScalar(scale);
            }

            scene.add(model);
            document.getElementById('status-msg').innerHTML = "<span class='text-green-400'>Model Loaded Successfully!</span> Click the green joints to pose.";
            
            model.traverse((child) => {
                if (child.isSkinnedMesh) {
                    handMesh = child;
                    handMesh.castShadow = true;
                    handMesh.receiveShadow = true;
                }
                
                if (child.isBone) {
                    skeletonBones.push(child);
                    
                    // Attach a hitbox to the bone for raycasting
                    const hitbox = new THREE.Mesh(hitboxGeo, hitboxMaterial);
                    // Counter-scale the hitboxes so they don't warp if the master model is scaled
                    hitbox.scale.setScalar(1 / model.scale.x); 
                    hitbox.userData.isJoint = true;
                    hitbox.userData.bone = child;
                    child.add(hitbox);
                    selectableJoints.push(hitbox);
                }
            });
            
            // Re-trigger UI inputs once loaded to apply default morphs
            skinToneSlider.dispatchEvent(new Event('input'));
            characterSlider.dispatchEvent(new Event('input'));
            updateGender('fem');
            
        }, 
        function (xhr) {
            console.log((xhr.loaded / xhr.total * 100) + '% loaded');
        }, 
        function (error) {
            console.error('Error loading GLB:', error);
            const errorText = error.message ? error.message : error.toString();
            document.getElementById('status-msg').innerHTML = `
                <span class='text-red-400 font-bold'>Error loading model: ${errorText}</span><br><br>
                <span class='text-gray-300 font-normal'>
                • If it says <b>"404"</b>: The file name/path is wrong (GitHub is strictly case-sensitive).<br>
                • If it mentions <b>"DRACO"</b>: The 3D model was exported with compression. Ask the artist to uncheck "Compression" in Blender.<br>
                • If you just fixed this: Press <b>Ctrl + F5</b> (Windows) or <b>Cmd + Shift + R</b> (Mac) to clear the cache.
                </span>`;
        });

        // --- INTERACTIVITY (RAYCASTING) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (event) => {
            // Ignore UI clicks
            if (event.clientX > window.innerWidth - 350 && event.clientY < window.innerHeight) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(selectableJoints);

            if (intersects.length > 0) {
                const hitObj = intersects[0].object;
                if(hitObj.userData.isJoint) {
                    transformControl.attach(hitObj.userData.bone);
                }
            } else {
                if(!transformControl.dragging) {
                    transformControl.detach();
                }
            }
        });

        // --- UI LOGIC ---
        const skinToneSlider = document.getElementById('skin-tone');
        const characterSlider = document.getElementById('character');
        const btnFem = document.getElementById('btn-fem');
        const btnMasc = document.getElementById('btn-masc');
        
        const colorFair = new THREE.Color('#ffe0bd');
        const colorDark = new THREE.Color('#2d160e');

        skinToneSlider.addEventListener('input', (e) => {
            const val = e.target.value / 100;
            document.getElementById('tone-val').innerText = `${e.target.value}%`;
            
            if (handMesh && handMesh.material) {
                // Tints the Albedo map based on the UI slider
                const blendedColor = new THREE.Color().copy(colorFair).lerp(colorDark, val);
                handMesh.material.color.copy(blendedColor);
            }
        });

        characterSlider.addEventListener('input', (e) => {
            const val = e.target.value / 100; 
            let label = "Medium";
            if (val < 0.3) label = "Delicate";
            else if (val > 0.7) label = "Rough";
            document.getElementById('char-val').innerText = label;

            if (handMesh && handMesh.morphTargetDictionary) {
                const delicateIdx = handMesh.morphTargetDictionary['Character_Delicate'];
                const roughIdx = handMesh.morphTargetDictionary['Character_Rough'];
                
                // Map 0-50 to Delicate, 50-100 to Rough
                if (delicateIdx !== undefined) {
                    handMesh.morphTargetInfluences[delicateIdx] = val < 0.5 ? (1.0 - (val * 2)) : 0;
                }
                if (roughIdx !== undefined) {
                    handMesh.morphTargetInfluences[roughIdx] = val > 0.5 ? ((val - 0.5) * 2) : 0;
                }
            }
        });

        function updateGender(gender) {
            if (gender === 'fem') {
                btnFem.classList.replace('hover:bg-white/20', 'bg-blue-500');
                btnFem.classList.add('text-white', 'shadow');
                btnMasc.classList.replace('bg-blue-500', 'hover:bg-white/20');
                btnMasc.classList.remove('text-white', 'shadow');
                
                if (handMesh && handMesh.morphTargetDictionary) {
                    const femIdx = handMesh.morphTargetDictionary['Gender_Feminine'];
                    const mascIdx = handMesh.morphTargetDictionary['Gender_Masculine'];
                    if (femIdx !== undefined) handMesh.morphTargetInfluences[femIdx] = 1.0;
                    if (mascIdx !== undefined) handMesh.morphTargetInfluences[mascIdx] = 0.0;
                }
            } else {
                btnMasc.classList.replace('hover:bg-white/20', 'bg-blue-500');
                btnMasc.classList.add('text-white', 'shadow');
                btnFem.classList.replace('bg-blue-500', 'hover:bg-white/20');
                btnFem.classList.remove('text-white', 'shadow');

                if (handMesh && handMesh.morphTargetDictionary) {
                    const femIdx = handMesh.morphTargetDictionary['Gender_Feminine'];
                    const mascIdx = handMesh.morphTargetDictionary['Gender_Masculine'];
                    if (femIdx !== undefined) handMesh.morphTargetInfluences[femIdx] = 0.0;
                    if (mascIdx !== undefined) handMesh.morphTargetInfluences[mascIdx] = 1.0;
                }
            }
        }

        btnFem.addEventListener('click', () => updateGender('fem'));
        btnMasc.addEventListener('click', () => updateGender('masc'));

        document.getElementById('reset-btn').addEventListener('click', () => {
            skinToneSlider.value = 50;
            skinToneSlider.dispatchEvent(new Event('input'));
            characterSlider.value = 50;
            characterSlider.dispatchEvent(new Event('input'));
            updateGender('fem');

            transformControl.detach();
            
            // Reset bone rotations
            skeletonBones.forEach(bone => {
                bone.rotation.set(0, 0, 0);
            });
            
            orbit.reset();
        });

        // Initialize UI State
        skinToneSlider.dispatchEvent(new Event('input'));
        characterSlider.dispatchEvent(new Event('input'));
        updateGender('fem');

        // --- ANIMATION LOOP ---
        window.addEventListener('resize', onWindowResize, false);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
